name: Test
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - name: Check formatting
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "These files are not formatted with gofmt:"
          echo "$unformatted"
          exit 1
        fi
    - name: Check go.mod is tidy
      run: go mod tidy -diff
    - name: Vet
      run: go vet ./...
    - name: Build
      run: go build ./...
    - name: Test
      run: go test -race -count=1 ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - name: Install shadowsocks-rust
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download --repo shadowsocks/shadowsocks-rust \
          --pattern 'shadowsocks-v*.x86_64-unknown-linux-gnu.tar.xz' --output shadowsocks-rust.tar.xz
        mkdir -p "$RUNNER_TEMP/shadowsocks-rust"
        tar -xJf shadowsocks-rust.tar.xz -C "$RUNNER_TEMP/shadowsocks-rust"
        rm shadowsocks-rust.tar.xz
        echo "$RUNNER_TEMP/shadowsocks-rust" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/shadowsocks-rust/ssserver" --version
    - name: Vet
      run: go vet -tags e2e ./e2e/
    - name: Test interoperability with shadowsocks-rust
      run: go test -tags e2e -race -count=1 -v ./e2e/
